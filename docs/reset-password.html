<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花计2046 - 重置密码</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #4F46E5 0%, #7C3AED 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    padding: 40px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .logo { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 22px; color: #111827; margin-bottom: 8px; }
  .sub { font-size: 14px; color: #6B7280; margin-bottom: 28px; }
  .field { text-align: left; margin-bottom: 18px; }
  .field label { display: block; font-size: 14px; color: #374151; margin-bottom: 6px; }
  .field input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid #D1D5DB;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: #7C3AED; }
  button {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, #4F46E5, #7C3AED);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { margin-top: 16px; font-size: 14px; min-height: 20px; }
  .msg.error { color: #EF4444; }
  .msg.success { color: #10B981; }
  .hint { font-size: 12px; color: #9CA3AF; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🌸</div>
  <h1>重置密码</h1>
  <p class="sub">为「花计2046」账号设置新密码</p>

  <div class="field">
    <label for="pwd">新密码</label>
    <input type="password" id="pwd" placeholder="至少 6 位" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="pwd2">确认新密码</label>
    <input type="password" id="pwd2" placeholder="再次输入新密码" autocomplete="new-password">
  </div>

  <button id="btn" onclick="submitReset()">确认修改</button>
  <div id="msg" class="msg"></div>
  <div class="hint">密码设置完成后，请使用新密码在 App 中登录</div>
</div>

<script>
  const SUPABASE_URL = 'https://skbdcshewqynpdhrwuto.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrYmRjc2hld3F5bnBkaHJ3dXRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzEzNjQsImV4cCI6MjEwMjAwNzM2NH0.IJzXGzzFb90r2Z6sPz1QmoogrE5EWiuhG0QEWG1FPHU';

  // 从 URL 中提取令牌（hash 或 query 中的 access_token）
  function getAccessToken() {
    const hash = new URLSearchParams(location.hash.substring(1));
    const query = new URLSearchParams(location.search);
    return hash.get('access_token') || query.get('access_token') || null;
  }

  const token = getAccessToken();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');

  function show(text, isError) {
    msg.textContent = text;
    msg.className = 'msg ' + (isError ? 'error' : 'success');
  }

  // 识别错误参数（如链接过期、已使用）
  const errorCode = hash.get('error_code') || query.get('error_code');
  const errorDesc = (hash.get('error_description') || query.get('error_description') || '').replace(/\+/g, ' ');

  if (errorCode) {
    let errText = '链接无效或已过期，请重新发送重置邮件。';
    if (errorCode === 'otp_expired') errText = '链接已过期，请返回 App 重新发送重置邮件。';
    else if (errorCode === 'otp_already_used' || errorCode === 'otp_used') errText = '该链接已使用，请返回 App 重新发送。';
    show(errText + (errorDesc ? '（' + errorDesc + '）' : ''), true);
    btn.disabled = true;
  } else if (!token) {
    show('链接无效，请重新发送重置邮件。', true);
    btn.disabled = true;
  }

  async function submitReset() {
    const pwd = document.getElementById('pwd').value;
    const pwd2 = document.getElementById('pwd2').value;

    if (pwd.length < 6) { show('密码至少需要 6 位', true); return; }
    if (pwd !== pwd2) { show('两次输入的密码不一致', true); return; }

    btn.disabled = true;
    show('正在设置新密码...', false);

    try {
      const resp = await fetch(SUPABASE_URL + '/auth/v1/user', {
        method: 'PUT',
        headers: {
          'apikey': ANON_KEY,
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ password: pwd })
      });

      if (resp.ok) {
        show('✅ 密码设置成功！请使用新密码在 App 中登录。', false);
        btn.disabled = true;
      } else {
        const data = await resp.json().catch(() => ({}));
        const errMsg = data.msg || data.error_description || data.message || '操作失败';
        show('设置失败：' + errMsg, true);
        btn.disabled = false;
      }
    } catch (e) {
      show('网络错误，请重试', true);
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
